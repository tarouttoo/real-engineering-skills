name: Agent Implement

# Issue-driven AFK run (phase 1: single agent, no planner, no parallelism).
# - Manual: Actions → Agent Implement → Run workflow → issue number
# - Automatic: label an issue with `ready-for-agent`

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to implement"
        required: true
        type: string
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-implement-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install -g @earendil-works/pi-coding-agent

      - name: Configure pi (zai auth + models)
        run: |
          mkdir -p ~/.pi/agent
          test -n "$ZAI_API_KEY" || { echo "ZAI_API_KEY secret is not set"; exit 1; }
          printf '{"zai":{"type":"api_key","key":"%s"}}\n' "$ZAI_API_KEY" > ~/.pi/agent/auth.json
          chmod 600 ~/.pi/agent/auth.json
          cp .sandcastle/pi/models-store.json .sandcastle/pi/settings.json ~/.pi/agent/

      - name: git identity
        run: |
          git config user.name "sandcastle-agent"
          git config user.email "sandcastle-agent@users.noreply.github.com"

      - name: Implement issue
        run: npx tsx .sandcastle/main.ts "$ISSUE_NUMBER"

      - name: Push branch
        run: git push -u origin "agent/issue-${ISSUE_NUMBER}"

      - name: Open pull request
        run: |
          BRANCH="agent/issue-${ISSUE_NUMBER}"
          TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq .title)
          if gh pr view "$BRANCH" --json url >/dev/null 2>&1; then
            echo "PR for $BRANCH already exists, skipping"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "agent: ${TITLE} (#${ISSUE_NUMBER})" \
              --body "Implements #${ISSUE_NUMBER}.

          Closes #${ISSUE_NUMBER}

          Ran via sandcastle (pi / glm-5.3-flash). Review the diff and the report comment on the issue."
          fi
